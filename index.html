  <script>
    
    var audio1 = document.getElementById('audio');

    
    document.querySelector('a-scene').addEventListener('loaded', function () {
      audio1.play();
    });

    let contador = 0;

    function handleInteraction(controller) {
      controller.addEventListener('triggerdown', function () {
                 const raycaster = controller.components.raycaster;
                  if (raycaster && raycaster.intersectedEls.length > 0) {
                    raycaster.intersectedEls.forEach(function (target) {
                              if (target.classList.contains('interactable')) {

                              if (!target.getAttribute('visible')) return; //No contar 2 veces al mismo

                              target.setAttribute('color', 'blue');
                              setTimeout(function () {
                                      target.setAttribute('visible', 'false');
                                      contador++;

                                      const contadorTexto = document.querySelector('#contador');
                                      if (contador >= 4) {
                                        contadorTexto.setAttribute('text', 'value: ¡Felicidades! Encontraste todas las evidencias');
                                      } else {
                                        contadorTexto.setAttribute('text', `value: Evidencias encontradas: ${contador}`);
                                      }
                            }, 300);
                          }
                    });
                  }
 });
}
  </script>
